services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learnquest
      POSTGRES_PASSWORD: learnquest
      POSTGRES_DB: learnquest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
